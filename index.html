<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiF Hub — Verify your email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F7F1E4;
  --paper:#FFFCF5;
  --ink:#241F17;
  --ink-soft:#6b6152;
  --gold:#C0923B;
  --gold-soft:#E4C878;
  --rose:#BD5F72;
  --rose-soft:#E7AEB8;
  --sage:#5B7A50;
  --sage-soft:#9FBB8E;

  --radius-lg:28px;
  --radius-md:16px;
  --radius-sm:10px;

  --ease-bloom:cubic-bezier(.22,1.15,.32,1);
  --ease-out:cubic-bezier(.19,1,.22,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 12% -10%, #fbf4de 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 10%, #f3e4d2 0%, transparent 55%),
    var(--cream);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  overflow-x:hidden;
  position:relative;
}

button,input{font:inherit}
a{color:inherit}

.ambient-bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.ambient-bg svg{
  position:absolute;
  opacity:.16;
}

.ambient-bg .cluster-a{
  top:-140px;
  left:-160px;
  width:560px;
  height:560px;
  animation:ambientRotate 160s linear infinite;
}

.ambient-bg .cluster-b{
  bottom:-200px;
  right:-180px;
  width:640px;
  height:640px;
  animation:ambientRotate 200s linear infinite reverse;
  opacity:.12;
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:.35;
  animation:floatBlob 16s ease-in-out infinite;
}

.blob--gold{
  width:340px;
  height:340px;
  top:8%;
  right:6%;
  background:var(--gold-soft);
}

.blob--rose{
  width:280px;
  height:280px;
  bottom:6%;
  left:4%;
  background:var(--rose-soft);
  animation-delay:-6s;
}

@keyframes ambientRotate{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

@keyframes floatBlob{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(22px,-18px)}
}

.site-header{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px clamp(20px,5vw,56px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:40px;
  height:40px;
  object-fit:contain;
  display:block;
  animation:fadeUp .7s var(--ease-out) both;
}

.brand-logo-fallback{
  display:none;
  width:40px;
  height:40px;
  align-items:center;
  justify-content:center;
  animation:fadeUp .7s var(--ease-out) both;
}

.brand-word{
  font-family:"Fraunces",serif;
  font-weight:600;
  font-size:1.15rem;
  letter-spacing:.01em;
  animation:fadeUp .7s .05s var(--ease-out) both;
}

.header-link{
  text-decoration:none;
  font-size:.85rem;
  font-weight:600;
  color:var(--ink-soft);
  padding:8px 16px;
  border:1px solid #d8cba9;
  border-radius:999px;
  transition:border-color .25s ease,color .25s ease,background .25s ease;
  animation:fadeUp .7s .05s var(--ease-out) both;
}

.header-link:hover{
  color:var(--ink);
  border-color:var(--gold);
  background:var(--paper);
}

.stage{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(8px,3vw,24px) 20px 80px;
  max-width:1080px;
  margin:0 auto;
}

.hero-copy{
  text-align:center;
  max-width:560px;
  margin-bottom:34px;
}

.eyebrow{
  margin:0 0 10px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold);
  animation:fadeUp .7s .1s var(--ease-out) both;
}

.headline{
  margin:0 0 14px;
  padding-bottom:.08em;
  font-family:"Fraunces",serif;
  font-weight:600;
  font-size:clamp(2.3rem,5vw,3.4rem);
  line-height:1.15;
  letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--ink) 30%,var(--rose) 90%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:fadeUp .8s .18s var(--ease-out) both;
}

.subhead{
  margin:0;
  color:var(--ink-soft);
  font-size:1.02rem;
  line-height:1.55;
  animation:fadeUp .8s .28s var(--ease-out) both;
}

.card{
  position:relative;
  width:100%;
  max-width:440px;
  background:
    linear-gradient(var(--paper),var(--paper)) padding-box,
    linear-gradient(135deg,var(--gold-soft),transparent 45%,var(--rose-soft)) border-box;
  border:1px solid transparent;
  border-radius:var(--radius-lg);
  box-shadow:
    0 30px 60px -30px rgba(60,45,20,.35),
    0 2px 0 rgba(255,255,255,.6) inset;
  padding:clamp(26px,4vw,38px);
  animation:cardBloom .85s .4s var(--ease-bloom) both;
}

.verify-form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.code-label{
  text-align:center;
  font-size:.78rem;
  font-weight:700;
  color:var(--ink-soft);
  letter-spacing:.02em;
  animation:fieldRise .55s .72s var(--ease-out) both;
}

.code-inputs{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
  animation:fieldRise .55s .8s var(--ease-out) both;
}

.code-input{
  width:100%;
  aspect-ratio:1 / 1.12;
  min-width:0;
  border-radius:var(--radius-sm);
  border:1.5px solid #e3d6b5;
  background:#fffdf9;
  color:var(--ink);
  text-align:center;
  font-size:clamp(1.35rem,5vw,1.7rem);
  font-weight:700;
  outline:none;
  transition:
    border-color .22s ease,
    box-shadow .22s ease,
    transform .15s ease,
    background .22s ease;
}

.code-input::selection{
  background:var(--gold-soft);
}

.code-input:focus-visible{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(192,146,59,.18);
  transform:translateY(-1px);
}

.code-input.is-good{
  border-color:var(--sage);
  background:#fbfdf8;
}

.code-input.is-bad{
  border-color:var(--rose);
  box-shadow:0 0 0 4px rgba(189,95,114,.10);
}

.code-note{
  min-height:20px;
  margin:0;
  text-align:center;
  color:var(--ink-soft);
  font-size:.78rem;
  line-height:1.45;
  animation:fadeUp .6s .92s var(--ease-out) both;
}

.code-note.good{
  color:var(--sage);
  font-weight:700;
}

.code-note.bad{
  color:var(--rose);
  font-weight:700;
}

.submit-btn{
  position:relative;
  overflow:visible;
  border:none;
  cursor:pointer;
  padding:14px 20px;
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-weight:700;
  font-size:.98rem;
  color:#fffdf6;
  background:linear-gradient(120deg,var(--gold) 0%,var(--rose) 100%);
  box-shadow:0 14px 26px -12px rgba(189,95,114,.55);
  transition:
    transform .18s var(--ease-out),
    box-shadow .18s var(--ease-out),
    filter .2s ease;
  animation:fieldRise .55s 1s var(--ease-out) both;
}

.submit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 30px -12px rgba(189,95,114,.6);
  filter:brightness(1.04);
}

.submit-btn:active{transform:translateY(0)}

.submit-btn:focus-visible{
  outline:3px solid var(--gold-soft);
  outline-offset:3px;
}

.submit-btn:disabled{
  cursor:not-allowed;
  background:#DCD3C0;
  color:#A89C87;
  box-shadow:none;
}

.submit-btn:disabled:hover{
  transform:none;
  box-shadow:none;
  filter:none;
}

.submit-btn.is-loading .btn-label{opacity:0}

.submit-btn.is-loading::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin:-9px 0 0 -9px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.55);
  border-top-color:#fff;
  animation:spin .7s linear infinite;
}

.submit-btn.is-success{
  background:linear-gradient(120deg,var(--sage-soft),var(--sage));
}

.btn-label{transition:opacity .15s ease}

.resend-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:2px;
  animation:fadeUp .6s 1.1s var(--ease-out) both;
}

.resend-text{
  font-size:.78rem;
  color:var(--ink-soft);
}

.resend-btn{
  appearance:none;
  border:0;
  padding:0;
  background:transparent;
  color:var(--rose);
  font-size:.78rem;
  font-weight:700;
  cursor:pointer;
}

.resend-btn:hover{text-decoration:underline}
.resend-btn:disabled{color:#b8ac93;cursor:not-allowed;text-decoration:none}

.back-link{
  text-align:center;
  font-size:.85rem;
  color:var(--ink-soft);
  text-decoration:none;
  margin-top:2px;
  animation:fadeUp .6s 1.18s var(--ease-out) both;
}

.back-link strong{
  color:var(--gold);
  font-weight:700;
}

.back-link:hover{text-decoration:underline}

.aspects-dots{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:6px;
  animation:fadeUp .6s 1.25s var(--ease-out) both;
}

.aspects-dots span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gold-soft);
}

.aspects-dots span:nth-child(2n){background:var(--rose-soft)}
.aspects-dots span:nth-child(3n){background:var(--sage-soft)}

.page-footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:10px 20px 40px;
  font-size:.78rem;
  color:var(--ink-soft);
}

.card.is-shaking{
  animation:shake .45s ease;
}

@keyframes spin{to{transform:rotate(360deg)}}

@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}

@keyframes cardBloom{
  from{opacity:0;transform:scale(.92) translateY(26px)}
  to{opacity:1;transform:none}
}

@keyframes fieldRise{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

@media (prefers-reduced-motion:reduce){
  *{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .ambient-bg .cluster-a,
  .ambient-bg .cluster-b,
  .ambient-bg .blob{
    animation:none !important;
  }
}

@media (max-width:520px){
  .site-header{padding:16px}
  .stage{padding-top:6px}
  .headline{font-size:2rem}

  .code-inputs{
    gap:7px;
  }

  .card{
    padding:24px 20px 26px;
  }
}
</style>
</head>

<body>
<div class="ambient-bg" aria-hidden="true">
  <div class="blob blob--gold"></div>
  <div class="blob blob--rose"></div>

  <svg class="cluster-a" viewBox="0 0 400 400" fill="none">
    <g stroke="#C0923B" stroke-width="2">
      <circle cx="200" cy="200" r="70"/>
      <circle cx="270" cy="200" r="70"/>
      <circle cx="235" cy="139" r="70"/>
      <circle cx="165" cy="139" r="70"/>
      <circle cx="130" cy="200" r="70"/>
      <circle cx="165" cy="261" r="70"/>
      <circle cx="235" cy="261" r="70"/>
    </g>
  </svg>

  <svg class="cluster-b" viewBox="0 0 400 400" fill="none">
    <g stroke="#BD5F72" stroke-width="2">
      <circle cx="200" cy="200" r="70"/>
      <circle cx="270" cy="200" r="70"/>
      <circle cx="235" cy="139" r="70"/>
      <circle cx="165" cy="139" r="70"/>
      <circle cx="130" cy="200" r="70"/>
      <circle cx="165" cy="261" r="70"/>
      <circle cx="235" cy="261" r="70"/>
    </g>
  </svg>
</div>

<header class="site-header">
  <div class="brand">
    <!-- Swap the image path for your real logo -->
    <img
      class="brand-logo"
      id="brandLogo"
      src="temp_logo.png"
      alt="Love is Foundation logo"
      onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';"
    >

    <div class="brand-logo-fallback" id="logoFallback" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
        <g stroke="#C0923B" stroke-width="3">
          <circle cx="50" cy="50" r="18"/>
          <circle cx="68" cy="50" r="18"/>
          <circle cx="59" cy="34" r="18"/>
          <circle cx="41" cy="34" r="18"/>
          <circle cx="32" cy="50" r="18"/>
          <circle cx="41" cy="66" r="18"/>
          <circle cx="59" cy="66" r="18"/>
        </g>
      </svg>
    </div>

    <span class="brand-word">LiF Hub</span>
  </div>

  <a class="header-link" href="index.html">Back to Hub</a>
</header>

<main class="stage">
  <section class="hero-copy">
    <p class="eyebrow">Love is Foundation</p>
    <h1 class="headline">Check your inbox</h1>
    <p class="subhead">
      We sent you a 6-digit code. Enter it below to continue into the LiF Hub.
    </p>
  </section>

  <section class="card" id="verifyCard">
    <form class="verify-form" id="verifyForm" novalidate>
      <label class="code-label" for="code-1">Enter your verification code</label>

      <div class="code-inputs" id="codeInputs" aria-label="6-digit verification code">
        <input class="code-input" id="code-1" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1" required>
        <input class="code-input" id="code-2" inputmode="numeric" maxlength="1" aria-label="Digit 2" required>
        <input class="code-input" id="code-3" inputmode="numeric" maxlength="1" aria-label="Digit 3" required>
        <input class="code-input" id="code-4" inputmode="numeric" maxlength="1" aria-label="Digit 4" required>
        <input class="code-input" id="code-5" inputmode="numeric" maxlength="1" aria-label="Digit 5" required>
        <input class="code-input" id="code-6" inputmode="numeric" maxlength="1" aria-label="Digit 6" required>
      </div>

      <p class="code-note" id="codeNote" aria-live="polite">
        The code expires after 10 minutes.
      </p>

      <button class="submit-btn" id="verifyBtn" type="submit" disabled>
        <span class="btn-label">Verify code</span>
      </button>

      <div class="resend-row">
        <span class="resend-text" id="resendText">Didn't get the email?</span>
        <button class="resend-btn" id="resendBtn" type="button">Resend code</button>
      </div>

      <a class="back-link" href="signup.html">
        Entered the wrong email? <strong>Go back</strong>
      </a>

      <div class="aspects-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </form>
  </section>
</main>

<footer class="page-footer">
  Love is Foundation — Parksville · St. Albert · Stockholm
</footer>

<script>
(function(){
  "use strict";

  const inputs = [...document.querySelectorAll(".code-input")];
  const form = document.getElementById("verifyForm");
  const card = document.getElementById("verifyCard");
  const verifyBtn = document.getElementById("verifyBtn");
  const codeNote = document.getElementById("codeNote");
  const resendBtn = document.getElementById("resendBtn");
  const resendText = document.getElementById("resendText");

  function getCode(){
    return inputs.map(input => input.value).join("");
  }

  function updateState(){
    const complete = inputs.every(input => /^\d$/.test(input.value));

    verifyBtn.disabled = !complete;

    inputs.forEach(input => {
      input.classList.toggle("is-good", complete);
    });

    if (!complete && !inputs.some(input => input.value)){
      inputs.forEach(input => input.classList.remove("is-good"));
      codeNote.className = "code-note";
      codeNote.textContent = "The code expires after 10 minutes.";
    }
  }

  function focusInput(index){
    if(index >= 0 && index < inputs.length){
      inputs[index].focus();
      inputs[index].select();
    }
  }

  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(-1);

      if(input.value && index < inputs.length - 1){
        focusInput(index + 1);
      }

      updateState();
    });

    input.addEventListener("keydown", (event) => {
      if(event.key === "Backspace" && !input.value && index > 0){
        focusInput(index - 1);
      }

      if(event.key === "ArrowLeft" && index > 0){
        focusInput(index - 1);
      }

      if(event.key === "ArrowRight" && index < inputs.length - 1){
        focusInput(index + 1);
      }
    });

    input.addEventListener("paste", (event) => {
      event.preventDefault();

      const pasted = (event.clipboardData || window.clipboardData)
        .getData("text")
        .replace(/\D/g, "")
        .slice(0, 6);

      if(!pasted) return;

      pasted.split("").forEach((digit, digitIndex) => {
        if(inputs[digitIndex]) inputs[digitIndex].value = digit;
      });

      focusInput(Math.min(pasted.length, 6) - 1);
      updateState();
    });

    input.addEventListener("focus", () => input.select());
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const code = getCode();

    if(code.length !== 6){
      card.classList.remove("is-shaking");
      void card.offsetWidth;
      card.classList.add("is-shaking");
      codeNote.className = "code-note bad";
      codeNote.textContent = "Please enter all 6 digits.";
      return;
    }

    verifyBtn.classList.add("is-loading");
    verifyBtn.disabled = true;

    // Demo verification. Replace with your real API call.
    setTimeout(() => {
      verifyBtn.classList.remove("is-loading");
      verifyBtn.classList.add("is-success");
      verifyBtn.querySelector(".btn-label").textContent = "Verified!";
      codeNote.className = "code-note good";
      codeNote.textContent = "You're all set — welcome to LiF Hub.";

      // Replace with your real redirect:
      // window.location.href = "index.html";
    }, 700);
  });

  let resendCooldown = 0;
  let resendTimer;

  resendBtn.addEventListener("click", () => {
    if(resendCooldown > 0) return;

    resendCooldown = 30;
    resendBtn.disabled = true;
    resendText.textContent = "Code sent again.";

    inputs.forEach(input => {
      input.value = "";
      input.classList.remove("is-good", "is-bad");
    });

    updateState();
    focusInput(0);

    resendTimer = setInterval(() => {
      resendCooldown--;

      if(resendCooldown <= 0){
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendText.textContent = "Didn't get the email?";
        resendBtn.textContent = "Resend code";
      } else {
        resendBtn.textContent = `Resend in ${resendCooldown}s`;
      }
    }, 1000);
  });

  updateState();
})();
</script>
</body>
</html>
